<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clock</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0b1626;cursor:none}
#sky{position:fixed;inset:0;transition:background 60s linear}
svg{position:fixed;left:0;bottom:0;width:100%;height:62vh}
.wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;text-shadow:0 4px 30px rgba(0,0,0,.35)}
#time{font-size:min(30vw,52vh);font-weight:300;letter-spacing:-.04em;line-height:.95;font-variant-numeric:tabular-nums}
#ampm{font-size:.22em;font-weight:400;letter-spacing:0;margin-left:.15em;opacity:.85}
#date{font-size:min(5.2vw,8vh);font-weight:400;margin-top:2vh;opacity:.95}
.star{position:fixed;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.0;transition:opacity 60s}
</style></head><body>
<div id="sky"></div><div id="stars"></div>
<svg viewBox="0 0 1600 600" preserveAspectRatio="none">
 <path id="m1" d="M0 330 L120 250 L220 300 L360 170 L480 260 L600 200 L760 300 L900 160 L1040 270 L1180 190 L1320 280 L1460 210 L1600 290 L1600 600 L0 600Z"/>
 <path id="m2" d="M0 420 L140 340 L300 400 L460 300 L620 390 L800 320 L980 410 L1140 330 L1300 400 L1460 340 L1600 390 L1600 600 L0 600Z"/>
 <path id="m3" d="M0 500 Q200 440 400 490 T800 480 T1200 500 T1600 470 L1600 600 L0 600Z"/>
</svg>
<div class="wrap"><div id="time"></div><div id="date"></div></div>
<script>
const T=document.getElementById('time'),D=document.getElementById('date'),S=document.getElementById('sky');
const P={night:['#0b1626','#1c2c4a',['#16233a','#101a2c','#0a1220']],dawn:['#f4a582','#7a8fbf',['#5b5f86','#3f4566','#272b45']],day:['#7cc3f0','#d8eefb',['#5f8f7a','#3f6e5a','#24503f']],dusk:['#2f3d6b','#e98d6b',['#4a3f62','#33294a','#1f1832']]};
function phase(h){return h<6||h>=21?'night':h<9?'dawn':h<17?'day':'dusk'}
const st=document.getElementById('stars');for(let i=0;i<90;i++){const s=document.createElement('div');s.className='star';s.style.left=Math.random()*100+'vw';s.style.top=Math.random()*45+'vh';st.appendChild(s)}
let last='';
function tick(){const n=new Date();let h=n.getHours(),m=n.getMinutes();
 T.innerHTML=((h%12)||12)+':'+String(m).padStart(2,'0')+'<span id="ampm">'+(h<12?'AM':'PM')+'</span>';
 D.textContent=n.toLocaleDateString('en-CA',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
 const p=phase(h);if(p!==last){last=p;const c=P[p];S.style.background=`linear-gradient(to bottom, ${c[0]}, ${c[1]})`;['m1','m2','m3'].forEach((id,i)=>document.getElementById(id).setAttribute('fill',c[2][i]));document.querySelectorAll('.star').forEach(s=>s.style.opacity=p==='night'?(.3+Math.random()*.7):0)}}
tick();setInterval(tick,1000);
async function wake(){try{await navigator.wakeLock.request('screen')}catch(e){}}
wake();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake()});
document.addEventListener('dblclick',()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()});
</script></body></html>
